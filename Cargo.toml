[package]
name = "limulx-linux-input-multiplexer"
version = "0.3.1"
edition = "2021"

[dependencies]
env_logger = "0.11"
evdev = { version = "0.12", features = ["tokio"] }
log = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
